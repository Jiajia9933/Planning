services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hdd_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hdd -d hdd_planner']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://hdd:${POSTGRES_PASSWORD}@postgres:5432/hdd_planner
    command: ['npx', 'tsx', 'src/db/migrate.ts']
    depends_on:
      postgres:
        condition: service_healthy

  route-optimizer:
    build:
      context: .
      dockerfile: Dockerfile.route-optimizer
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DATABASE_URL: postgresql://hdd:${POSTGRES_PASSWORD}@postgres:5432/hdd_planner
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      # Same-origin via the frontend's nginx /api/ proxy — no separate
      # public origin for the API, so this is just the one public URL.
      CORS_ORIGIN: ${PUBLIC_ORIGIN}
      APP_BASE_URL: ${PUBLIC_ORIGIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      # Not yet consumed by backend code — wired ahead of the actual
      # routeOptimizerClient.ts integration (see project memory).
      ROUTE_OPTIMIZER_URL: http://route-optimizer:8000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      route-optimizer:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_CESIUM_ION_TOKEN: ${VITE_CESIUM_ION_TOKEN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Bind-mounted, not baked into the image at build time: cert renewal
      # and nginx config edits (see the HTTPS setup) then only need a
      # `docker compose restart frontend`, never a rebuild.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  certbot-etc:
  certbot-webroot:

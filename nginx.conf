server {
    listen 80;

    # Let's Encrypt's HTTP-01 challenge writes a token file here and expects
    # it served back over plain HTTP — has to stay reachable even once this
    # server otherwise redirects everything else to HTTPS (see the deploy's
    # own nginx.conf on the host once a cert exists, not this repo copy).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend lives in its own container on the internal Docker network —
    # proxying it under the same public origin means the browser never needs
    # a second CORS-exposed origin/port, and colleagues only ever see one URL.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # No client-side router in this app, but keeps any deep-linked path
        # (e.g. the password-reset `?resetToken=` query on `/`) working.
        try_files $uri $uri/ /index.html;
    }
}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hdd
      POSTGRES_PASSWORD: hdd_dev
      POSTGRES_DB: hdd_planner
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hdd -d hdd_planner']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
